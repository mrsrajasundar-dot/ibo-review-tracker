<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Counter Cash Report</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #eef2f6; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .sheet-container { background: #fff; width: 100%; max-width: 680px; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border: 1px solid #cbd5e1; }
    
    .sheet-title { text-align: center; margin-top: 0; margin-bottom: 12px; color: #334155; font-size: 20px; }
    .date-row { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; gap: 8px; font-weight: bold; }
    .date-row input { padding: 6px 10px; border: 1px solid #94a3b8; border-radius: 5px; font-weight: bold; }

    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #64748b; padding: 8px; text-align: center; font-size: 14px; }
    
    /* Excel Brown Header Theme */
    .header-brown { background-color: #c07248; color: #ffffff; font-weight: bold; }
    .sub-header { background-color: #edd5c5; color: #000; font-weight: 600; }
    
    input[type="number"] { width: 100%; max-width: 75px; padding: 5px; text-align: center; border: 1px solid #94a3b8; border-radius: 4px; font-size: 14px; }
    input[type="number"]:focus { outline: 2px solid #c07248; background-color: #fffbeb; }

    .total-row { font-weight: bold; background-color: #f1f5f9; }
    .grand-highlight { background-color: #fde68a; font-weight: bold; }
    
    .diff-table td { padding: 8px 12px; font-size: 15px; }
    .amt-col { text-align: right; padding-right: 12px; font-weight: bold; }

    .btn-wrap { display: flex; gap: 10px; margin-top: 10px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-reset { background: #ef4444; color: white; }
    .btn-print { background: #2563eb; color: white; }
  </style>
</head>
<body>

<div class="sheet-container">
  <h2 class="sheet-title">Daily Counter Cash Management</h2>
  
  <div class="date-row">
    <label>Date:</label>
    <input type="text" id="reportDate" value="25-09-2026">
  </div>

  <!-- TABLE 1: TOTAL SALE CASH (Counter 1 + Counter 2) -->
  <table>
    <thead>
      <tr class="header-brown">
        <th colspan="5">TOTAL SALE CASH</th>
      </tr>
      <tr class="sub-header">
        <th style="width: 18%;">Denom</th>
        <th style="width: 20%;">C-1 Count</th>
        <th style="width: 20%;">C-2 Count</th>
        <th style="width: 17%;">Total Count</th>
        <th style="width: 25%;">Amount (₹)</th>
      </tr>
    </thead>
    <tbody id="saleBody">
      <!-- Generated rows for 500, 200, 100, 50, 20, 10, Coin -->
    </tbody>
    <tfoot>
      <tr class="total-row header-brown">
        <td colspan="3" style="text-align: right; padding-right: 15px;">Total Sale Cash:</td>
        <td id="totalSaleCount">0</td>
        <td class="amt-col" id="totalSaleAmount">₹ 0.00</td>
      </tr>
    </tfoot>
  </table>

  <!-- Difference / Balance Check Section -->
  <table class="diff-table">
    <tr style="background-color: #f8fafc;">
      <td style="font-weight: bold; width: 45%;">System / POS Sale Cash:</td>
      <td style="width: 25%;">
        <input type="number" id="posCash" placeholder="0" style="max-width: 120px;" oninput="updateCalculations()">
      </td>
      <td class="amt-col" id="diffDisplay" style="color: #0f766e;">Diff: ₹ 0.00</td>
    </tr>
  </table>

  <!-- TABLE 2: FLOAT CASH (Separate Table) -->
  <table>
    <thead>
      <tr class="header-brown">
        <th colspan="3">FLOAT CASH</th>
      </tr>
      <tr class="sub-header">
        <th style="width: 25%;">Denom</th>
        <th style="width: 35%;">Count</th>
        <th style="width: 40%;">Amount (₹)</th>
      </tr>
    </thead>
    <tbody id="floatBody">
      <!-- Generated rows for Float -->
    </tbody>
    <tfoot>
      <tr class="total-row header-brown">
        <td style="text-align: right; padding-right: 15px;">Total Float:</td>
        <td id="totalFloatCount">0</td>
        <td class="amt-col" id="totalFloatAmount">₹ 0.00</td>
      </tr>
    </tfoot>
  </table>

  <!-- Buttons -->
  <div class="btn-wrap">
    <button class="btn btn-reset" onclick="resetForm()">Reset All</button>
    <button class="btn btn-print" onclick="window.print()">Print / Save PDF</button>
  </div>
</div>

<script>
  const denoms = [
    { label: "500", val: 500 },
    { label: "200", val: 200 },
    { label: "100", val: 100 },
    { label: "50", val: 50 },
    { label: "20", val: 20 },
    { label: "10", val: 10 },
    { label: "Coin", val: 1 }
  ];

  function renderTables() {
    const saleBody = document.getElementById('saleBody');
    const floatBody = document.getElementById('floatBody');

    denoms.forEach((d, i) => {
      // Sale Table Row
      saleBody.innerHTML += `
        <tr>
          <td><strong>${d.label}</strong></td>
          <td><input type="number" min="0" id="c1_${i}" oninput="updateCalculations()"></td>
          <td><input type="number" min="0" id="c2_${i}" oninput="updateCalculations()"></td>
          <td id="sumCount_${i}">0</td>
          <td class="amt-col" id="amt_${i}">₹ 0.00</td>
        </tr>
      `;

      // Float Table Row (without coin if not needed, or with coin)
      if (d.label !== "Coin") {
        floatBody.innerHTML += `
          <tr>
            <td><strong>${d.label}</strong></td>
            <td><input type="number" min="0" id="flt_${i}" oninput="updateCalculations()"></td>
            <td class="amt-col" id="fltAmt_${i}">₹ 0.00</td>
          </tr>
        `;
      }
    });
  }

  function updateCalculations() {
    let grandSaleCount = 0;
    let grandSaleAmt = 0;

    denoms.forEach((d, i) => {
      let c1 = parseInt(document.getElementById(`c1_${i}`).value) || 0;
      let c2 = parseInt(document.getElementById(`c2_${i}`).value) || 0;
      let rowCount = c1 + c2;
      let rowAmt = rowCount * d.val;

      grandSaleCount += rowCount;
      grandSaleAmt += rowAmt;

      document.getElementById(`sumCount_${i}`).innerText = rowCount;
      document.getElementById(`amt_${i}`).innerText = "₹ " + rowAmt.toLocaleString('en-IN', {minimumFractionDigits: 2});
    });

    document.getElementById('totalSaleCount').innerText = grandSaleCount;
    document.getElementById('totalSaleAmount').innerText = "₹ " + grandSaleAmt.toLocaleString('en-IN', {minimumFractionDigits: 2});

    // POS Cash Difference Check
    let posVal = parseFloat(document.getElementById('posCash').value) || 0;
    let diff = grandSaleAmt - posVal;
    let diffEl = document.getElementById('diffDisplay');
    diffEl.innerText = (diff >= 0 ? "+ ₹ " : "- ₹ ") + Math.abs(diff).toLocaleString('en-IN', {minimumFractionDigits: 2});
    diffEl.style.color = diff === 0 ? "#0f766e" : (diff > 0 ? "#16a34a" : "#dc2626");

    // Float Calculations
    let grandFloatCount = 0;
    let grandFloatAmt = 0;

    denoms.forEach((d, i) => {
      let fltInput = document.getElementById(`flt_${i}`);
      if (fltInput) {
        let count = parseInt(fltInput.value) || 0;
        let amt = count * d.val;
        grandFloatCount += count;
        grandFloatAmt += amt;
        document.getElementById(`fltAmt_${i}`).innerText = "₹ " + amt.toLocaleString('en-IN', {minimumFractionDigits: 2});
      }
    });

    document.getElementById('totalFloatCount').innerText = grandFloatCount;
    document.getElementById('totalFloatAmount').innerText = "₹ " + grandFloatAmt.toLocaleString('en-IN', {minimumFractionDigits: 2});
  }

  function resetForm() {
    document.querySelectorAll('input[type="number"]').forEach(input => input.value = '');
    updateCalculations();
  }

  renderTables();
</script>

</body>
</html>
